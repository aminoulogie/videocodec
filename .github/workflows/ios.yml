name: iOS app

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build (unsigned; Sideloadly signs it with your Apple ID)
        working-directory: ios
        run: |
          set -o pipefail
          xcodegen generate
          xcodebuild -project TikTokHD.xcodeproj -scheme TikTokHD -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -n 80
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/TikTokHD.app Payload/
          zip -qry TikTokHD.ipa Payload
          ls -la TikTokHD.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: TikTokHD-ipa
          path: ios/TikTokHD.ipa
          if-no-files-found: error
      - name: Publish the release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" ios/TikTokHD.ipa pc/tiktok_prep.py pc/tiktok_app.py \
            --title "TikTok HD $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md

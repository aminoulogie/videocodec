name: iOS app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check the iPhone patches match the PC ones byte for byte
        run: |
          set -e
          python3 tests/parity.py out
          swiftc -O ios/TikTokHD/Mp4Methods.swift tests/swiftcheck/PatchErrorShim.swift tests/swiftcheck/main.swift -o swiftcheck
          ./swiftcheck tests/fixtures out
          fail=0
          for p in out/*.mp4; do
            case "$p" in *.swift.mp4) continue;; esac
            s="${p%.mp4}.swift.mp4"
            if cmp -s "$p" "$s"; then echo "same: $(basename "$p")"; else echo "DIFFERENT: $(basename "$p")"; fail=1; fi
          done
          exit $fail
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build (unsigned; Sideloadly signs it with your Apple ID)
        working-directory: ios
        run: |
          set -o pipefail
          xcodegen generate
          xcodebuild -project TikTokHD.xcodeproj -scheme TikTokHD -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -n 80
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/TikTokHD.app Payload/
          zip -qry TikTokHD.ipa Payload
          ls -la TikTokHD.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: TikTokHD-ipa
          path: ios/TikTokHD.ipa
          if-no-files-found: error
      - name: Publish the release (version in VERSION; same version = files replaced)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$(tr -d ' \n' < VERSION)"
          TAG="v$V"
          # every release file ends with the version (no " 2" copies when downloading a new one)
          mkdir -p dist
          cp ios/TikTokHD.ipa "dist/TikTokHD-$V.ipa"
          # the PC files import each other by name, so they go in one versioned zip
          (cd pc && zip -q "../dist/TikTokHD-PC-$V.zip" tiktok_prep.py tiktok_methods.py tiktok_app.py TIKTOK_FIDELITY_LICENSE.txt)
          FILES="dist/TikTokHD-$V.ipa dist/TikTokHD-PC-$V.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber
            gh release edit "$TAG" --notes-file RELEASE_NOTES.md
          else
            gh release create "$TAG" $FILES --target "$GITHUB_SHA" \
              --title "TikTok HD $TAG" --notes-file RELEASE_NOTES.md --latest
          fi
